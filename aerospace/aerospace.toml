config-version = 2

after-startup-command = []
start-at-login = false

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = [
  "1", "2", "3", "4", "5", "6", "7", "8", "9",
  "A", "B", "C", "D", "E", "F", "G", "I", "M", "N", "O", "P", "Q",
  "R", "S", "T", "U", "V", "W", "X", "Y", "Z",
]

on-mode-changed = []

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 0
inner.vertical   = 0
outer.left       = 0
outer.bottom     = 0
outer.top        = 0
outer.right      = 0

[mode.main.binding]
    # Layout (Alt+Shift+/, Alt+Shift+,)
    alt-shift-slash = 'layout tiles horizontal vertical'
    alt-shift-comma = 'layout accordion horizontal vertical'

    # Fokus bewegen (Alt+Shift+HJKL)
    alt-shift-h = 'focus left'
    alt-shift-j = 'focus down'
    alt-shift-k = 'focus up'
    alt-shift-l = 'focus right'

    # Fenster verschieben (Ctrl+Alt+HJKL)
    ctrl-alt-h = 'move left'
    ctrl-alt-j = 'move down'
    ctrl-alt-k = 'move up'
    ctrl-alt-l = 'move right'

    # Resize (Alt+Shift + - / =)
    alt-shift-minus = 'resize smart -50'
    alt-shift-equal = 'resize smart +50'

    # Workspaces wechseln (Alt+Shift+Zahlen/Buchstaben)
    alt-shift-1 = 'workspace 1'
    alt-shift-2 = 'workspace 2'
    alt-shift-3 = 'workspace 3'
    alt-shift-4 = 'workspace 4'
    alt-shift-5 = 'workspace 5'
    alt-shift-6 = 'workspace 6'
    alt-shift-7 = 'workspace 7'
    alt-shift-8 = 'workspace 8'
    alt-shift-9 = 'workspace 9'

    alt-shift-a = 'workspace A'
    alt-shift-b = 'workspace B'
    alt-shift-c = 'workspace C'
    alt-shift-d = 'workspace D'
    alt-shift-e = 'workspace E'
    alt-shift-f = 'workspace F'
    alt-shift-g = 'workspace G'
    alt-shift-i = 'workspace I'
    alt-shift-m = 'workspace M'
    alt-shift-n = 'workspace N'
    alt-shift-o = 'workspace O'
    alt-shift-p = 'workspace P'
    alt-shift-q = 'workspace Q'
    alt-shift-r = 'workspace R'
    alt-shift-s = 'workspace S'
    alt-shift-t = 'workspace T'
    alt-shift-u = 'workspace U'
    alt-shift-v = 'workspace V'
    alt-shift-w = 'workspace W'
    alt-shift-x = 'workspace X'
    alt-shift-y = 'workspace Y'
    alt-shift-z = 'workspace Z'

    # Fenster in Workspace verschieben (Ctrl+Alt+Zahl/Buchstabe)
    ctrl-alt-1 = 'move-node-to-workspace 1'
    ctrl-alt-2 = 'move-node-to-workspace 2'
    ctrl-alt-3 = 'move-node-to-workspace 3'
    ctrl-alt-4 = 'move-node-to-workspace 4'
    ctrl-alt-5 = 'move-node-to-workspace 5'
    ctrl-alt-6 = 'move-node-to-workspace 6'
    ctrl-alt-7 = 'move-node-to-workspace 7'
    ctrl-alt-8 = 'move-node-to-workspace 8'
    ctrl-alt-9 = 'move-node-to-workspace 9'

    ctrl-alt-a = 'move-node-to-workspace A'
    ctrl-alt-b = 'move-node-to-workspace B'
    ctrl-alt-c = 'move-node-to-workspace C'
    ctrl-alt-d = 'move-node-to-workspace D'
    ctrl-alt-e = 'move-node-to-workspace E'
    ctrl-alt-f = 'move-node-to-workspace F'
    ctrl-alt-g = 'move-node-to-workspace G'
    ctrl-alt-i = 'move-node-to-workspace I'
    ctrl-alt-m = 'move-node-to-workspace M'
    ctrl-alt-n = 'move-node-to-workspace N'
    ctrl-alt-o = 'move-node-to-workspace O'
    ctrl-alt-p = 'move-node-to-workspace P'
    ctrl-alt-q = 'move-node-to-workspace Q'
    ctrl-alt-r = 'move-node-to-workspace R'
    ctrl-alt-s = 'move-node-to-workspace S'
    ctrl-alt-t = 'move-node-to-workspace T'
    ctrl-alt-u = 'move-node-to-workspace U'
    ctrl-alt-v = 'move-node-to-workspace V'
    ctrl-alt-w = 'move-node-to-workspace W'
    ctrl-alt-x = 'move-node-to-workspace X'
    ctrl-alt-y = 'move-node-to-workspace Y'
    ctrl-alt-z = 'move-node-to-workspace Z'

    # Workspace back & forth / Monitor wechseln
    alt-shift-tab = 'workspace-back-and-forth'
    ctrl-alt-tab = 'move-workspace-to-monitor --wrap-around next'

    # Service-Mode
    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main'] # reset layout
    f         = ['layout floating tiling', 'mode main'] # toggle floating/tiling
    backspace = ['close-all-windows-but-current', 'mode main']

    # Join containers (Alt+Shift+HJKL im Service-Mode)
    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
